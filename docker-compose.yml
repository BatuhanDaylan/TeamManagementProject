version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: team_management_user
      POSTGRES_PASSWORD: team_management_password
      POSTGRES_DB: team_management_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
